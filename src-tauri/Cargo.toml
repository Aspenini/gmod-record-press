[package]
name = "gmod-record-press"
version = "0.1.0"
description = "Desktop app for creating Working Record Player album addons for Garry's Mod"
authors = ["you"]
edition = "2021"

[lib]
name = "gmod_record_press_lib"
# Desktop only: staticlib is for mobile and doubles link time.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Match pick_image filters. Default features pull rav1e (AVIF) and OpenEXR.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tga", "webp"] }
texpresso = { version = "2", features = ["rayon"] }
crc32fast = "1"
base64 = "0.22"
walkdir = "2"
rayon = "1"
steamworks = "0.13"
lofty = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
